<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Reef Fortune — Arcade Fish Shooter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="topbar">
      <div class="logo">REEF<span>FORTUNE</span></div>
      <div class="top-right">
        <div id="auth-bar" class="auth-bar hidden">
          <span id="auth-user"></span>
          <button id="auth-logout" class="mode-btn">LOG OUT</button>
        </div>
        <button id="btn-sound" class="icon-btn" title="Sound on/off">🔊</button>
        <button id="btn-full" class="icon-btn" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div id="bottombar">
      <div class="panel balance-panel">
        <div class="label">BALANCE</div>
        <div class="value" id="balance">0</div>
      </div>

      <div class="panel win-panel">
        <div class="label">WIN</div>
        <div class="value" id="win">0</div>
      </div>

      <div class="bet-controls">
        <button id="bet-down" class="round-btn">−</button>
        <div class="panel bet-panel">
          <div class="label">BET</div>
          <div class="value" id="bet">10</div>
        </div>
        <button id="bet-up" class="round-btn">+</button>
      </div>

      <button id="btn-auto" class="mode-btn">AUTO</button>
      <button id="btn-lock" class="mode-btn">TARGET</button>
      <button id="btn-free" class="mode-btn free hidden">+1000 COINS</button>
    </div>
  </div>

  <div id="msg-layer"></div>

  <div id="auth-modal" class="auth-modal hidden">
    <div class="auth-card">
      <div class="logo">REEF<span>FORTUNE</span></div>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab on">LOG IN</button>
        <button id="tab-signup" class="auth-tab">CREATE ACCOUNT</button>
      </div>
      <p class="auth-sub" id="auth-sub">Welcome back — sign in to keep your coin balance.</p>
      <input id="auth-email" type="email" placeholder="email" autocomplete="email">
      <input id="auth-pwd" type="password" placeholder="password" autocomplete="current-password">
      <div id="auth-msg" class="auth-msg"></div>
      <button id="auth-submit" class="mode-btn auth-submit">LOG IN</button>
      <p class="auth-fine">Free-play. No real money.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/sfx.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
</body>
</html>
