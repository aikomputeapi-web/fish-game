<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Kirin — Owner Panel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="panel-body">
<header class="panel-head">
  <div class="logo">FIRE<span>KIRIN</span> <small>OWNER</small></div>
  <div class="head-right">
    <span id="me-name" class="muted"></span>
    <button id="btn-logout" class="btn ghost">LOG OUT</button>
  </div>
</header>
<main class="panel-main">
  <section class="stats-strip" id="stats"></section>
  <section class="settings-box">
    <h3>RTP / Difficulty</h3>
    <div class="row">
      <label>RTP <input id="rtp" type="range" min="0.10" max="1.20" step="0.01" value="0.96"></label>
      <span id="rtp-val" class="mono">0.96</span>
      <span class="muted">house edge <span id="edge" class="mono">4%</span></span>
      <button id="btn-rtp" class="btn primary">SAVE RTP</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label>Bullet factor <input id="bf" type="range" min="0.5" max="2.0" step="0.1" value="1.0"></label>
      <span id="bf-val" class="mono">1.0</span>
      <button id="btn-bf" class="btn ghost">SAVE</button>
    </div>
  </section>
  <section class="users-box">
    <h3>Users <input id="search" type="text" placeholder="search username…" class="search"></h3>
    <table id="users-tbl">
      <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Points</th><th>Manager</th><th>Status</th><th>Joined</th><th>Last login</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><h3 id="modal-title"></h3><div id="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script src="/auth.js"></script>
<script src="/admin.js"></script>
</body>
</html>
